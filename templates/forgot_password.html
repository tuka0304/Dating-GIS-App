{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quên Mật Khẩu</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=2">
</head>
<body class="page-login">
    <div class="box">
        <h2>Khôi phục mật khẩu 🔐</h2>
        <p style="font-size: 13px; color: #666; margin-bottom: 15px;">Vui lòng nhập email bạn đã dùng để đăng ký.</p>
        
        {% if error %}
            <div style="background: #fff7e6; border: 1px solid #ffe58f; padding: 10px; border-radius: 8px; margin-bottom: 20px; color: #d46b08; text-align: center; font-size: 13px;">
                {{ error }}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="email" name="email" placeholder="Nhập địa chỉ Email" required autofocus>
            <button type="submit">Gửi mã xác nhận</button>
        </form>

        <div class="footer">
            <a href="{% url 'login' %}">Quay lại Đăng nhập</a>
        </div>
    </div>
</body>
</html>
