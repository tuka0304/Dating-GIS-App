{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=2">
</head>
<body class="page-login">
    <div class="box">
        <h2>Mật khẩu mới ✨</h2>
        
        {% if error %}
            <div style="background: #fff1f0; border: 1px solid #ffa39e; padding: 10px; border-radius: 8px; margin-bottom: 20px; color: #cf1322; text-align: center; font-size: 13px;">
                {{ error }}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="password" name="new_password" placeholder="Nhập mật khẩu mới" required autofocus>
            <input type="password" name="confirm_password" placeholder="Nhập lại mật khẩu mới" required>
            <button type="submit" style="background: #27ae60;">Lưu mật khẩu</button>
        </form>
    </div>
</body>
</html>
