{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lạc đường | Dating GIS</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body { 
            background: #fff0f5; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
        }
        .error-box { 
            background: white; padding: 50px 40px; border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(216, 27, 96, 0.15); 
            max-width: 400px; width: 90%;
        }
        .error-box h1 { 
            font-size: 80px; color: #d81b60; margin: 0; text-shadow: 2px 2px 5px rgba(216,27,96,0.2);
        }
        .error-box h2 { color: #333; margin: 10px 0; font-size: 22px; }
        .error-box p { color: #777; font-size: 15px; margin: 15px 0 30px 0; line-height: 1.5; }
        .home-btn { 
            background: linear-gradient(45deg, #ff69b4, #d81b60); 
            color: white; text-decoration: none; padding: 12px 25px; 
            border-radius: 25px; font-weight: bold; display: inline-block; 
            transition: 0.3s; box-shadow: 0 4px 10px rgba(216, 27, 96, 0.3);
        }
        .home-btn:hover { 
            transform: translateY(-3px); box-shadow: 0 6px 15px rgba(216, 27, 96, 0.4); 
        }
        .broken-heart { font-size: 50px; color: #ffb6c1; margin-bottom: 10px; animation: heartbeat 2s infinite; }
        
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="error-box">
        <div class="broken-heart"><i class="fas fa-heart-broken"></i></div>
        <h1>404</h1>
        <h2>Trang này đi lạc rồi!</h2>
        <p>Có vẻ như đường link bạn tìm kiếm không tồn tại, hoặc người ấy đã rời khỏi bản đồ của bạn mất rồi.</p>
        <a href="{% url 'home' %}" class="home-btn"><i class="fas fa-map-marked-alt"></i> Quay lại Bản đồ</a>
    </div>
</body>
</html>
