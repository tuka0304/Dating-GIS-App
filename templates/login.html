<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <style>
        body { background-color: #313338; color: #dbdee1; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #2b2d31; padding: 40px; border-radius: 8px; width: 320px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); text-align: center; }
        h2 { color: #f2f3f5; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #1e1f22; border: 1px solid #1e1f22; color: white; border-radius: 4px; box-sizing: border-box; }
        input:focus { outline: none; border-color: #5865f2; }
        button { width: 100%; padding: 12px; background: #5865f2; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 15px; font-size: 16px; transition: 0.2s; }
        button:hover { background: #4752c4; }
        a { color: #00a8fc; text-decoration: none; font-size: 14px; }
        a:hover { text-decoration: underline; }
        .footer { margin-top: 20px; font-size: 14px; color: #949ba4; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Chào mừng trở lại! 👋</h2>
        <form method="post">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Tên đăng nhập" required autofocus>
            <input type="password" name="password" placeholder="Mật khẩu" required>
            <button type="submit">Đăng nhập</button>
        </form>
        <div class="footer">
            Chưa có tài khoản? <a href="{% url 'register' %}">Đăng ký ngay</a>
        </div>
    </div>
</body>
</html>
